server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    # The registry itself must not try to register with or fetch from another Eureka.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
logging:
  level:
    root: "INFO"
