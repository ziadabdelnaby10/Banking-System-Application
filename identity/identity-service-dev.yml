server:
  port: ${SERVER_PORT:9001}

spring:
  config:
    # Also allow local .env-based overrides when running outside containers.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:bank_identity}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:rootroot}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      max-lifetime: 1200000
      connection-timeout: 20000
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  #web:
    #error:
      #include-message: never
      #include-stacktrace: never
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        show_sql: true
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
eureka:
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: "INFO"
bank:
  identity:
    token:
    # Enabled so you don't have to generate a private-key.pem it will be generated auto
      allow-ephemeral-key: true
  security:
    enabled: false
    # Endpoints reachable without a bearer token. Everything else requires a valid access token.
    public-paths:
      - /actuator/health/**
      - /actuator/info
      - /.well-known/jwks.json
      - /api/v1/auth/login
      - /api/v1/auth/mfa/verify
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
    # AUDITOR needs a cross-branch view; ADMIN is unrestricted.
    branch-bypass-roles: ADMIN,AUDITOR
    jwt:
      issuer: ${IDENTITY_JWT_ISSUER:http://localhost:9001/.well-known/jwks.json}
  # Signing key: set BANK_IDENTITY_TOKEN_PRIVATEKEYLOCATION=file:/run/secrets/identity-jwt-private.pem
  # (PKCS#8 PEM). Never commit keys.
