# ACCOUNT SERVICE CONFIGURATION
# Production settings: no secret defaults, SQL logging off, quiet logs.
server:
  port: ${SERVER_PORT:9003}
eureka:
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

spring:
  config:
    # Also allow local .env-based overrides when running outside containers.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:bank_account}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:rootroot}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      max-lifetime: 1200000
      connection-timeout: 20000
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
  jpa:
    # Never lazy-load while rendering JSON: every query is explicit, which keeps N+1 out of the web layer.
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Safety net: collections that are touched anyway are loaded in batches of 50, not one by one.
        default_batch_fetch_size: 50
        format_sql: false
        show_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  cache:
    type: caffeine
    cache-names: account-products
    # The product catalogue is tiny and practically static; the short TTL lets other instances see a change within a minute.
    caffeine:
      spec: maximumSize=10,expireAfterWrite=60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: "WARN"
bank:
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/info
    # AUDITOR needs a cross-branch view; ADMIN is unrestricted.
    branch-bypass-roles: ADMIN,AUDITOR
    jwt:
      # Must equal the issuer Identity writes into its tokens, otherwise every token is rejected.
      issuer: ${IDENTITY_JWT_ISSUER}
      jwk-set-uri: ${IDENTITY_JWK_SET_URI}
