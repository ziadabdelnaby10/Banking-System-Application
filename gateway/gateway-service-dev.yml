server:
  port: ${SERVER_PORT:9000}

spring:
  config:
    # Also allow local .env-based overrides when running outside containers.
    import: optional:file:.env[.properties]
  main:
    web-application-type: reactive
    cloud:
    gateway:
      server:
        webflux:
          # ROUTES: which URL goes to which service. "lb://name" = look the service up in Eureka.
          # To add a service: add its API route here, one docs route, and one springdoc.swagger-ui.urls entry below.
          routes:
            - id: identity-api
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/**,/.well-known/jwks.json
            # Swagger: /docs/<service>/v3/api-docs is forwarded to <service>/v3/api-docs
            - id: identity-docs
              uri: lb://identity-service
              predicates:
                - Path=/docs/identity/v3/api-docs/**
              filters:
                - RewritePath=/docs/identity/(?<segment>.*), /$\{segment}
            - id: customer-api
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/branches/**,/api/v1/customers/**
            - id: customer-docs
              uri: lb://customer-service
              predicates:
                - Path=/docs/customer/v3/api-docs/**
              filters:
                - RewritePath=/docs/customer/(?<segment>.*), /$\{segment}
            # Opening http://localhost:9000/ lands on the Swagger page.
            - id: root-to-swagger
              uri: no://op
              predicates:
                - Path=/
              filters:
                - RedirectTo=302, /swagger-ui.html
          # CORS = which websites (origins) a browser is allowed to call this API from.
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,X-Correlation-Id
                exposed-headers: X-Correlation-Id,Retry-After
                # Bearer tokens travel in a header, never in cookies.
                allow-credentials: false
                max-age: 3600
eureka:
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

bank:
  security:
    enabled: true
    # The gateway authenticates (valid token required); roles and branch scope are enforced by each service.
    # Verification key (one of): BANK_SECURITY_JWT_PUBLICKEYLOCATION=file:/run/secrets/identity-jwt-public.pem
    #                            BANK_SECURITY_JWT_JWKSETURI=http://identity-service/.well-known/jwks.json
    # PUBLIC PATHS = endpoints reachable WITHOUT a token (you can't have a token before you log in).
    public-paths:
      - /actuator/health/**
      - /actuator/info
      - /.well-known/jwks.json
      - /api/v1/auth/login
      - /api/v1/auth/mfa/verify
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      # Swagger UI page, its assets, its config and each service's OpenAPI document
      - /
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /v3/api-docs/**
      - /docs/*/v3/api-docs/**
    jwt:
      # Only tokens issued by this "issuer" (Identity's address) are accepted.
      issuer: ${IDENTITY_JWT_ISSUER:bank}
      jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:9001/.well-known/jwks.json}
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: identity-service
        url: /docs/identity/v3/api-docs
      - name: customer-service
        url: /docs/customer/v3/api-docs
    urls-primary-name: identity-service
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: "INFO"

management:
  endpoints:
    web:
      exposure:
        # Only expose health/info monitoring endpoints.
        include: health,info
