services: # Top-level key defining the services in this compose file
  postgres: # PostgreSQL service (system of record for the app)
    image: postgres:16-alpine # lightweight Postgres image for dev
    container_name: banking-postgres # container name for easier reference
    restart: unless-stopped # restart policy
    ports:
      - "5434:5432" # expose Postgres port to host for local connections
    environment: # environment variables for Postgres configuration
      POSTGRES_DB: ${POSTGRES_DB:-banking_app} # database name (from .env or default)
      POSTGRES_USER: ${POSTGRES_USER:-user} # DB user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootroot} # DB password
      TZ: UTC # set timezone
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=300"] # additional Postgres runtime options
    volumes:
      - postgres_data:/var/lib/postgresql/data # persist DB files in a named volume
      - ./infra/db/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # run init scripts on startup
    networks:
      - backend_network # connect to the backend network for inter-service communication
    healthcheck: # container healthcheck for orchestration
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-banking_app}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis: # Redis service for caching and support features
    image: redis:7.2-alpine # lightweight Redis image
    container_name: banking-redis # container name for easier reference
    restart: unless-stopped # restart policy
    ports:
      - "6379:6379" # expose Redis port to host
    command: ["redis-server", "--maxmemory" , "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-banking_redis_password}"] # enable AOF persistence and set password
    volumes:
      - redis_data:/data # persist Redis data
    networks:
      - backend_network # connect to the backend network for inter-service communication
    healthcheck: # healthcheck to ensure Redis is responsive
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-banking_redis_password} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-1: # Kafka broker 1 (combined broker+controller for local KRaft cluster)
    image: confluentinc/cp-kafka:7.4.0 # Confluent Platform image (KRaft capable)
    container_name: banking-kafka-1 # container name for easier reference
    restart: unless-stopped # restart policy
    ports:
      - "9092:9092" # broker 1 external listener
    environment: # Kafka / KRaft environment variables
      CLUSTER_ID: "WnLkTHhkQaiJbwP8FClPhw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # keep combined roles as requested
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      KAFKA_LISTENERS: PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9090,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3 # internal topic replication across 3 brokers
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3 # txn log replication across 3 brokers
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 # tolerate one broker outage
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3 # default replication factor for new topics
      KAFKA_MIN_INSYNC_REPLICAS: 2 # require 2 in-sync replicas for writes
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    networks:
      - backend_network # connect to the backend network for inter-service communication
    healthcheck: # ensure broker is responding
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-2: # Kafka broker 2 (follower/leader eligible)
    image: confluentinc/cp-kafka:7.4.0
    container_name: banking-kafka-2
    restart: unless-stopped
    ports:
      - "9093:9093" # broker 2 external listener
    environment:
      CLUSTER_ID: "WnLkTHhkQaiJbwP8FClPhw"
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      KAFKA_LISTENERS: PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9090,EXTERNAL://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9093 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-3: # Kafka broker 3 (follower/leader eligible)
    image: confluentinc/cp-kafka:7.4.0
    container_name: banking-kafka-3
    restart: unless-stopped
    ports:
      - "9094:9094" # broker 3 external listener
    environment:
      CLUSTER_ID: "WnLkTHhkQaiJbwP8FClPhw"
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      KAFKA_LISTENERS: PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9090,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9094 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  mailhog: # MailHog for capturing sent emails in local development
    image: mailhog/mailhog:latest # MailHog image
    container_name: banking-mailhog # container name for easier reference
    restart: unless-stopped # restart policy
    ports:
      - "1025:1025" # SMTP port for apps to send mail to
      - "8025:8025" # HTTP UI port to view captured emails
    healthcheck: # check SMTP port is open
      test: ["CMD-SHELL", "nc -z localhost 1025 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes: # Named volumes used by services
  postgres_data: # Postgres data persistence volume
    driver: local # use local driver for volume storage
  redis_data: # Redis data persistence volume
    driver: local # use local driver for volume storage
  kafka_1_data: # Kafka broker 1 data persistence volume
    driver: local # use local driver for volume storage
  kafka_2_data: # Kafka broker 2 data persistence volume
    driver: local # use local driver for volume storage
  kafka_3_data: # Kafka broker 3 data persistence volume
    driver: local # use local driver for volume storage

networks:
  backend_network: # custom network for backend services
    driver: bridge # use bridge driver for inter-container communication