name: Backend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: banking_app_test
          POSTGRES_USER: banking_app
          POSTGRES_PASSWORD: banking_app_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U banking_app -d banking_app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate project structure
        run: |
          if [ ! -f pom.xml ] && [ ! -f gradlew ]; then
            echo "Neither pom.xml nor gradlew was found in Backend. Add a Maven or Gradle build before using CI."
            exit 1
          fi

      - name: Run Maven verify
        if: ${{ hashFiles('pom.xml') != '' }}
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/banking_app_test
          SPRING_DATASOURCE_USERNAME: banking_app
          SPRING_DATASOURCE_PASSWORD: banking_app_password
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: '6379'
        run: ./mvnw -B -ntp clean verify

      - name: Run Gradle build
        if: ${{ hashFiles('gradlew') != '' }}
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/banking_app_test
          SPRING_DATASOURCE_USERNAME: banking_app
          SPRING_DATASOURCE_PASSWORD: banking_app_password
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: '6379'
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Build container image
        run: docker build -t banking-system-app:ci .
