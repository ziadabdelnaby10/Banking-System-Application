# GATEWAY CONFIGURATION (plain words)
# The Gateway is the single front door: the frontend only talks to it (port 9000); it checks the login
# token and forwards the request to the right service. Values like ${NAME:default} mean
# "use environment variable NAME, or the default if it is not set".
spring:
  application:
    name: gateway-service
  config:
    # Pull extra settings from the Config service if it is running (optional = start without it).
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  profiles:
    # Which profile is active: "dev" for local work (see application-dev.yml), "prod" by default.
    active: ${PROFILE:dev}
