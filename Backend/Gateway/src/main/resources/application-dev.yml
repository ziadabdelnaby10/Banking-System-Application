# DEV PROFILE: Swagger UI is reachable without a token so you can read the docs.
# (Calling protected endpoints from the page still needs a token: use Authorize.)
# This list REPLACES the one in application.yml, so it repeats the normal public paths.
bank:
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/info
      - /.well-known/jwks.json
      - /api/v1/auth/login
      - /api/v1/auth/mfa/verify
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      # Swagger UI page, its assets, its config and each service's OpenAPI document
      - /
      - /swagger-ui.html
      - /swagger-ui/**
      - /webjars/**
      - /v3/api-docs/**
      - /docs/*/v3/api-docs/**
