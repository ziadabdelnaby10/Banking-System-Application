# TRANSACTION SERVICE CONFIGURATION - PROD
# Production settings: no secret defaults, SQL logging off, quiet logs.
server:
  port: ${SERVER_PORT:9005}
eureka:
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

spring:
  config:
    # Also allow local .env-based overrides when running outside containers.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:bank_transaction}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      max-lifetime: 1200000
      connection-timeout: 20000
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
  jpa:
    # Never lazy-load while rendering JSON: every query is explicit, which keeps N+1 out of the web layer.
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc:
          time_zone: UTC
          # Transaction, history and outbox rows are sent to the database in batches.
          batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  level:
    root: "WARN"
bank:
  transaction:
    # The bank's cash account in the Ledger: the other side of every deposit and withdrawal.
    # It must be listed in the Ledger's bank.ledger.system-accounts.
    cash-account-id: ${TRANSACTION_CASH_ACCOUNT_ID}
    limits:
      per-transaction: ${TRANSACTION_LIMIT_PER_TXN:1000000.00}
      daily: ${TRANSACTION_LIMIT_DAILY:5000000.00}
    approval:
      # Transactions of at least this amount, and every reversal, wait for a checker (maker-checker, ADR-005).
      threshold: ${TRANSACTION_APPROVAL_THRESHOLD:50000.00}
    clients:
      # Service names resolved through Eureka. Set load-balanced=false and a full URL to call a fixed host.
      ledger:
        base-url: ${LEDGER_SERVICE_URL:http://ledger-service}
        load-balanced: ${LEDGER_SERVICE_LOAD_BALANCED:true}
        connect-timeout: 2s
        read-timeout: 5s
      account:
        base-url: ${ACCOUNT_SERVICE_URL:http://account-service}
        load-balanced: ${ACCOUNT_SERVICE_LOAD_BALANCED:true}
        connect-timeout: 2s
        read-timeout: 5s
  security:
    public-paths:
      - /actuator/health/**
      - /actuator/info
    branch-bypass-roles: ADMIN,AUDITOR
    jwt:
      # Must equal the issuer Identity writes into its tokens, otherwise every token is rejected.
      issuer: ${IDENTITY_JWT_ISSUER}
      jwk-set-uri: ${IDENTITY_JWK_SET_URI}
